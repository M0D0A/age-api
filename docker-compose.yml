version: '3.8'

services:
  age_app:
    build: .
    container_name: age-app
    expose:
      - "8000"
    networks:
      - app_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: age-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - age_app
    networks:
      - app_network
    restart: unless-stopped

  nginx-prometheus-exporter:
    image: nginx/nginx-prometheus-exporter:0.3.0 # (машины с nginx_exporter используют старую версию 0.3.0, названия метрик в новой версии отличаются, поэтому использую старую)
    container_name: age-nginx-prometheus-exporter
    command:
      - "--nginx.scrape-uri=http://nginx:80/nginx_status"
    ports:
      - 9113:9113
    depends_on:
      - nginx
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge
    name: app_network